name: Web a počasí

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'   # každých 15 minut stáhne počasí a data sítě BTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stáhnout počasí (Schwetzingen)
        run: |
          mkdir -p site
          cp index.html site/
          curl -sf --retry 3 --retry-delay 5 \
            "https://api.open-meteo.com/v1/forecast?latitude=49.38&longitude=8.57&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=4" \
            -o site/weather.json \
          || echo '{"error":true,"reason":"stažení předpovědi selhalo"}' > site/weather.json

      - name: Stáhnout data sítě BTC
        run: |
          python3 - <<'PY'
          import json, time, urllib.request

          def get(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'ipad-ticker'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read().decode())
              except Exception as e:
                  print('Chyba', url, e)
                  return None

          out = {'updated': int(time.time())}
          fng = get('https://api.alternative.me/fng/?limit=2')
          if fng and fng.get('data'):
              d = fng['data']
              out['fng'] = {'value': int(d[0]['value']), 'label': d[0]['value_classification'],
                            'prev': int(d[1]['value']) if len(d) > 1 else None}
          h = get('https://mempool.space/api/blocks/tip/height')
          if h is not None:
              out['height'] = int(h)
          fees = get('https://mempool.space/api/v1/fees/recommended')
          if fees:
              out['fees'] = fees
          da = get('https://mempool.space/api/v1/difficulty-adjustment')
          if da:
              out['diff'] = {'progress': da.get('progressPercent'), 'change': da.get('difficultyChange'),
                             'remaining': da.get('remainingBlocks'), 'eta': da.get('estimatedRetargetDate')}
          hr = get('https://mempool.space/api/v1/mining/hashrate/3d')
          if hr and hr.get('currentHashrate'):
              out['hashrate'] = hr['currentHashrate']
          json.dump(out, open('site/metrics.json', 'w'))
          print(json.dumps(out, indent=2))
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
